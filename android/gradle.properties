org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# Kotlin incremental compile breaks when project (e.g. D:) and Pub cache (C:) are on different Windows drives.
kotlin.incremental=false
# Retry untuk network issues
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
# Timeout untuk network
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
